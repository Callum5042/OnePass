# .NET Desktop
# Build and run tests for .NET Desktop or Windows classic desktop solutions.
# Add steps that publish symbols, save build artifacts, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/windows/dot-net

trigger:
- master

schedules:
- cron: '0 0 * * *'
  displayName: Daily midnight build
  branches:
    include:
      - master
  always: true

pool:
  vmImage: 'windows-latest'

variables:
  projects: '**/*.csproj'
  WpfProject: 'OnePass.WPF/OnePass.WPF.csproj'
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.x'
    
- task: DotNetCoreCLI@2
  displayName: Restore Projects
  inputs:
    command: 'restore'
    projects: '$(projects)'
    feedsToUse: 'select'
    vstsFeed: '3e812210-512f-48b2-aa4c-15ac454ff157'

- task: DotNetCoreCLI@2
  displayName: Build Projects
  inputs:
    command: 'build'
    projects: '$(WpfProject)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: Test OnePass
  inputs:
    command: 'test'
    projects: |
      OnePass.Tests\OnePass.Tests.csproj
      OnePass.WPF.Tests\OnePass.WPF.Tests.csproj
    arguments: '--configuration $(buildConfiguration) --no-restore'