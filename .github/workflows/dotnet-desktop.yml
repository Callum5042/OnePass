name: OnePass CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: OnePass.slnx
  WPF_PROJECT: OnePass.WPF/OnePass.WPF.csproj
  BUILD_CONFIGURATION: Release

jobs:
  build-and-test:
    name: Windows - build and test
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        id: setup-dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Select the installed .NET 10 SDK
        shell: pwsh
        run: |
          $sdkVersion = '${{ steps.setup-dotnet.outputs.dotnet-version }}'
          dotnet new globaljson --sdk-version $sdkVersion --force

      - name: Restore
        run: dotnet restore $env:SOLUTION

      - name: Build
        run: dotnet build $env:SOLUTION --configuration $env:BUILD_CONFIGURATION --no-restore

      - name: Test OnePass
        run: dotnet test OnePass.Tests/OnePass.Tests.csproj --configuration $env:BUILD_CONFIGURATION --no-build --no-restore

      - name: Test OnePass WPF
        run: dotnet test OnePass.WPF.Tests/OnePass.WPF.Tests.csproj --configuration $env:BUILD_CONFIGURATION --no-build --no-restore

      - name: Publish Windows application
        run: dotnet publish $env:WPF_PROJECT --configuration $env:BUILD_CONFIGURATION --no-build --no-restore --output artifacts/OnePass-Windows

      - name: Upload Windows application
        uses: actions/upload-artifact@v7
        with:
          name: OnePass-Windows-${{ github.sha }}
          path: artifacts/OnePass-Windows
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android - build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Android

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Test, lint, and build Android application
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload Android test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OnePass-Android-Test-Report-${{ github.sha }}
          path: Android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Android application
        uses: actions/upload-artifact@v7
        with:
          name: OnePass-Android-${{ github.sha }}
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
